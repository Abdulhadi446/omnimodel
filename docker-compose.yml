version: '3.8'

services:
  omnimodel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnimodel
    image: omnimodel:latest
    
    # Resource constraints (1GB total)
    memory: 1g
    memswap: 1g
    cpus: '2'
    
    # Volumes for persistence
    volumes:
      - ./models/quantized:/app/models/quantized:ro
      - ./checkpoints/adapters:/app/checkpoints/adapters:ro
      - ./input:/app/input
      - ./output:/app/output
      - ./logs:/app/logs
    
    # Environment
    environment:
      PYTHONUNBUFFERED: "1"
      TORCH_NUM_THREADS: "1"
      MEMORY_LIMIT: "900"
    
    # Ports for API (if exposed)
    ports:
      - "8000:8000"
    
    # Restart policy
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    # Run with CPU affinity
    cpuset: "0-3"

  # Optional: Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-storage:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-storage:
  grafana-storage:

networks:
  default:
    name: omnimodel-net
